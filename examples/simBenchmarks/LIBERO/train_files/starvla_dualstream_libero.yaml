run_id: libero_posttrain_umi110k_b128
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: hejz26-tsinghua-university
wandb_project: qwenpi-vla
is_debug: false
version_id: "0.21"

framework:
  name: DualStreamQwenPI
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-2B-Instruct
    # The complete UMI checkpoint is loaded by trainer.pretrained_checkpoint.
    load_weights: false
    attn_implementation: sdpa
    vl_hidden_dim: 2048
    dual_stream:
      enabled: true
      # Must equal sorted(set(deepstack_visual_indexes) | {depth-1}) of the
      # loaded checkpoint; validated at model construction.
      interaction_indexes: [5, 11, 17, 23]
      num_shared_tokens: 32
      num_heads: 16
      intermediate_size: 4096
      gate_hidden_size: 256
      gate_init_value: 0.01
      gate_output_weight_std: 0.001
      attention_dropout: 0.0
  action_model:
    action_dim: 16
    state_dim: 16
    # Match the UMI v2 state-free action head; LIBERO samples need no state input.
    use_state: false
    action_horizon: 16
    # Keep the historical LIBERO repeat count for the LayerNorm comparison.
    repeated_diffusion_steps: 1
    decoder_input_norm: layer_norm
    diffusion_model_cfg:
      cross_condition_norm: layer_norm

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /mnt/workspace/Native_Policy/user/hjz/starVLA/playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_all_umi16
    drop_incomplete_action_chunks: true
    # 16D: anchor-relative EEF [position(3), quaternion xyzw(4), gripper(1)] + masked right arm.
    action_type: relative_eef_pose_quat
    action_horizon: 16
    # LIBERO-specific q01/q99 statistics over all complete 16-step windows.
    normalization_statistics: /mnt/workspace/Native_Policy/user/hjz/starVLA/playground/Datasets/LEROBOT_LIBERO_DATA/libero_umi16_statistics_h16.json
    sequential_step_sampling: False
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    # Single-node 16 PPU: 16 x 16 x gradient_accumulation_steps(1) = global batch 256.
    per_device_batch_size: 16
    load_all_data_for_training: true
    video_backend: torchvision_av
    image_size: [224, 224]
    num_workers: 4
    prefetch_factor: 2
    pin_memory: false

trainer:
  # Initialize model weights from UMI; start a new LIBERO optimizer/scheduler run.
  pretrained_checkpoint: /mnt/workspace/Native_Policy/user/hjz/starVLA/playground/Checkpoints/starvla_umi_b24/checkpoints/steps_110000_pytorch_model.pt
  is_resume: false
  max_train_steps: 15000
  num_warmup_steps: 750
  save_interval: 5000
  keep_last_checkpoints: 3
  eval_interval: 10000000
  learning_rate:
    base: 3.0e-05
    # One flat LR for the whole VLM interface (incl. dual-stream stages and
    # shared_init): build_param_lr_groups recurses module.parameters() without
    # dedup, so a nested child key would put the same params in two groups and
    # crash AdamW ("some parameters appear in more than one parameter group").
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  # Keep freeze_modules empty: freezing `qwen_vl_interface` here would also
  # freeze the new interaction_stages/shared_init and they would never train.
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
